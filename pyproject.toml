[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftsentry"
version = "0.1.0"
description = "LSTM autoencoder for transaction anomaly and drift detection, served via FastAPI"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]

[project.scripts]
driftsentry = "driftsentry.cli:main"

[tool.setuptools.packages.find]
include = ["driftsentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
